<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Будильник</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="sage">

  <!-- шапка -->
  <header class="topbar">
    <span class="app-title">Будильник</span>
    <button id="menuBtn" class="icon-btn" data-icon="menu" data-fallback="☰" aria-label="Меню"></button>
  </header>

  <!-- список будильников -->
  <main id="listWrap">
    <div id="alarmList"></div>
    <div id="emptyHint" class="empty-hint hidden">
      Пока пусто 🌿<br>Нажми <b>+</b> внизу, чтобы добавить будильник
    </div>
  </main>

  <!-- строка массового добавления (фото 3) -->
  <div id="batchBar" class="batch-bar hidden">
    <input id="batchInput" type="text" placeholder="18:00, 19:00, 20:13" autocomplete="off">
    <button id="batchOk" class="icon-btn" data-icon="check" data-fallback="✓" title="Дальше"></button>
    <button id="batchCancel" class="icon-btn" data-icon="close" data-fallback="✕" title="Отмена"></button>
  </div>

  <!-- нижняя панель -->
  <footer class="bottombar">
    <button id="addMultiBtn" class="icon-btn big" data-icon="plus-multi" data-fallback="✚✚" aria-label="Добавить несколько"></button>
    <button id="addSingleBtn" class="icon-btn big" data-icon="plus" data-fallback="+" aria-label="Добавить будильник"></button>
  </footer>

  <!-- боковое меню --> 
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-top">
      <button id="drawerMenuBtn" class="icon-btn" data-icon="menu" data-fallback="☰" aria-label="Закрыть меню"></button>
    </div>
    <div class="drawer-body">
      <button id="appearanceBtn" class="drawer-row">Оформление</button>
      <div id="themeList" class="theme-list hidden">
        <button class="theme-btn" data-theme-id="sage"><span class="dot" style="background:#a9c2b3"></span>Шалфей</button>
        <button class="theme-btn" data-theme-id="dark"><span class="dot" style="background:#2e3a34"></span>Тёмная</button>
        <button class="theme-btn" data-theme-id="light"><span class="dot" style="background:#e9e9e9"></span>Светлая</button>
        <button class="theme-btn" data-theme-id="rose"><span class="dot" style="background:#e7bfc7"></span>Розовая</button>
        <button class="theme-btn" data-theme-id="sky"><span class="dot" style="background:#b9cfe4"></span>Небесная</button>
      </div>
    </div>
    <div class="drawer-bottom"></div>
  </aside>

  <!-- редактор будильника (фото 2) -->
  <div id="editorOverlay" class="overlay hidden">
    <div class="editor panel">
      <div class="panel-bar"><span id="editorTitle">Новый будильник</span></div>
      <div class="panel-body">

        <div class="row" id="timeRow">
          <label class="row-label" for="edTime">Время</label>
          <input id="edTime" class="time-input" type="time" value="00:00">
        </div>

        <div class="row">
          <span class="row-label">Повтор</span>
          <button id="edRepeatBtn" class="box-btn">
            <span id="edRepeatLabel">Однократно</span>
            <span class="ico-slot" data-icon="repeat" data-fallback="⟳"></span>
          </button>
        </div>

        <div class="row hidden" id="anchorRow">
          <label class="row-label" for="edAnchor">Первый рабочий день</label>
          <input id="edAnchor" type="date" class="date-input">
        </div>

        <div class="row">
          <span class="row-label">Мелодия</span>
          <div class="melody-wrap">
            <button id="edMelodyBtn" class="box-btn melody-btn">ВЫБРАТЬ</button>
            <button id="melodyPreview" class="icon-btn small hidden" title="Прослушать">▶</button>
            <button id="melodyClear" class="icon-btn small hidden" title="Убрать мелодию">✕</button>
          </div>
        </div>
        <input id="melodyFile" type="file" accept="audio/*" class="hidden">

        <div class="note-title">Пометка</div>
        <input id="edNote" class="note-input" type="text" maxlength="80" placeholder="...">

        <div class="editor-actions">
          <button id="edCancel" class="icon-btn" data-icon="close" data-fallback="✕" title="Закрыть без сохранения"></button>
          <button id="edSave" class="icon-btn" data-icon="check" data-fallback="✓" title="Сохранить"></button>
        </div>

      </div>
    </div>
  </div>

  <!-- выпадающий список графиков (фото 4), позиционируется через JS -->
  <div id="repeatMenu" class="repeat-menu hidden"></div>

  <!-- календарь своих дат -->
  <div id="calOverlay" class="overlay hidden">
    <div class="calendar panel">
      <div class="panel-bar">Свои даты</div>
      <div class="cal-nav">
        <button id="calYearPrev" class="cal-arrow" title="Год назад">«</button>
        <button id="calMonthPrev" class="cal-arrow" title="Месяц назад">‹</button>
        <span id="calTitle"></span>
        <button id="calMonthNext" class="cal-arrow" title="Месяц вперёд">›</button>
        <button id="calYearNext" class="cal-arrow" title="Год вперёд">»</button>
      </div>
      <div class="cal-weekdays">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div class="cal-selected-title">Выбрано: <span id="calCount">0</span></div>
      <div id="calSelected" class="cal-selected"></div>
      <div class="editor-actions">
        <button id="calClear" class="text-btn">Очистить</button>
        <button id="calCancel" class="icon-btn" data-icon="close" data-fallback="✕" title="Отмена"></button>
        <button id="calDone" class="icon-btn" data-icon="check" data-fallback="✓" title="Готово"></button>
      </div>
    </div>
  </div>

  <!-- экран звонка -->
  <div id="ringOverlay" class="ring hidden">
    <div class="ring-time" id="ringTime">00:00</div>
    <div class="ring-note" id="ringNote"></div>
    <div class="ring-actions">
      <button id="ringSnooze" class="ring-btn">Отложить<br><small>5 мин</small></button>
      <button id="ringStop" class="ring-btn primary">Выключить</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
